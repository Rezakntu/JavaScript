<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter</title>
    <!-- font-awesome -->
        <link rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        >

    <!-- styles -->
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>
        <section class="container">
            <!-- title -->
             <div class="title">
                <h2>our colleagues</h2>
                <div class="underline"></div>
             </div>
             <!-- Review -->
              <article class="review">
                <div class="img-container">
                    <img src="./profile_pics/person-1.jpg" alt="person-1" id="person-img">
                </div>
                <h4 id="author">Mike Tyson</h4>
                <p id="job">Web Developer</p>
                <p id="info">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Et voluptatum ipsam quam maxime consequatur cumque fuga dolorem nemo reiciendis non.
                </p>
                <!-- prev next buttons -->
                 <div class="button-container">
                    <button class="prev-btn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="next-btn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                 </div>
                 <!-- random button -->
                  <button class="random-btn">Surprise Me!</button>
              </article>
        </section>
    </main>
    <h1>review project</h1>
    <!-- javascript -->
     <script src="app.js"></script>
</body>
</html>
